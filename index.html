<!DOCTYPE html>
<html>
<head>
    <title>Data Tool</title>
</head>
<body style="text-align:center; font-family:Arial;">

<h1>Data Cleaner</h1>

<input type="file" id="fileInput"><br><br>

<button onclick="analyze()">Analyze</button>
<button onclick="download()">Download</button>

<h3 id="status"></h3>

<div id="insights"></div>
<table border="1" id="previewTable" style="margin:auto;"></table>

<script>
let fileId = null;

const API_URL = "https://order-intelligence-api-1.onrender.com";

async function analyze() {
    let file = document.getElementById("fileInput").files[0];

    if (!file) {
        alert("File select kar!");
        return;
    }

    document.getElementById("status").innerText = "Processing...";

    let formData = new FormData();
    formData.append("file", file);

    try {
        let res = await fetch(API_URL + "/analyze/", {
            method: "POST",
            body: formData
        });

        let data = await res.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        fileId = data.file_id;

        document.getElementById("status").innerText = "Done ✅";

        let ins = data.insights;
        document.getElementById("insights").innerHTML =
            "Total: " + ins.total_rows +
            "<br>Valid: " + ins.valid_numbers +
            "<br>Invalid: " + ins.invalid_numbers +
            "<br>Duplicates: " + ins.duplicate_numbers;

        let table = document.getElementById("previewTable");
        table.innerHTML = "";

        if (data.preview.length > 0) {
            let headers = Object.keys(data.preview[0]);

            let row = table.insertRow();
            headers.forEach(h => {
                let cell = row.insertCell();
                cell.innerHTML = "<b>" + h + "</b>";
            });

            data.preview.forEach(item => {
                let row = table.insertRow();
                headers.forEach(h => {
                    let cell = row.insertCell();
                    cell.innerText = item[h];
                });
            });
        }

    } catch (err) {
        console.log(err);
        alert("Error aaya, console check kar!");
    }
}

function download() {
    if (!fileId) {
        alert("Pehle analyze karo!");
        return;
    }

    window.open(API_URL + "/download/" + fileId);
}
</script>

</body>
</html>
