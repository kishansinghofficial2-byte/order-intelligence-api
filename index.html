<!DOCTYPE html>
<html>
<head>
    <title>Data Intelligence Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
        }
        .container {
            width: 60%;
            margin: auto;
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background: grey;
        }
        .cards {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .card {
            padding: 15px;
            border-radius: 8px;
            width: 30%;
            color: white;
        }
        .high { background: red; }
        .medium { background: orange; }
        .low { background: green; }
        .insight {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            color: white;
            border-radius: 5px;
        }
        .loader {
            margin-top: 10px;
            color: blue;
        }
        .error {
            margin-top: 10px;
            color: red;
        }
        pre {
            text-align: left;
            background: #eee;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Data Intelligence Dashboard</h1>

    <input type="file" id="fileInput"><br>

    <button id="analyzeBtn" onclick="analyze()">Analyze</button>
    <button onclick="download()">Download</button>

    <div id="loader" class="loader"></div>
    <div id="error" class="error"></div>

    <div id="summary" class="cards"></div>

    <div id="insight" class="insight"></div>

    <h3>Preview</h3>
    <pre id="output"></pre>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";

async function analyze() {
    let file = document.getElementById("fileInput").files[0];
    let loader = document.getElementById("loader");
    let errorBox = document.getElementById("error");
    let btn = document.getElementById("analyzeBtn");

    errorBox.innerText = "";

    if (!file) {
        errorBox.innerText = "⚠️ Please select a file first";
        return;
    }

    loader.innerText = "Processing...";
    btn.disabled = true;

    let formData = new FormData();
    formData.append("file", file);

    try {
        let res = await fetch(API_URL + "/analyze/", {
            method: "POST",
            body: formData
        });

        let data = await res.json();

        if (data.error) {
            errorBox.innerText = data.error;
            loader.innerText = "";
            btn.disabled = false;
            return;
        }

        // Summary
        document.getElementById("summary").innerHTML = `
            <div class="card high">High: ${data.summary.high_risk} (${data.summary.high_risk_percent}%)</div>
            <div class="card medium">Medium: ${data.summary.medium_risk}</div>
            <div class="card low">Low: ${data.summary.low_risk}</div>
        `;

        // Insight
        document.getElementById("insight").innerText = data.insight;

        // Preview
        document.getElementById("output").innerText =
            JSON.stringify(data.preview, null, 2);

    } catch (err) {
        errorBox.innerText = "❌ Server error";
    }

    loader.innerText = "";
    btn.disabled = false;
}

async function download() {
    let file = document.getElementById("fileInput").files[0];
    let errorBox = document.getElementById("error");

    errorBox.innerText = "";

    if (!file) {
        errorBox.innerText = "⚠️ Please select a file first";
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    let res = await fetch(API_URL + "/download-result/", {
        method: "POST",
        body: formData
    });

    let blob = await res.blob();
    let url = window.URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "result.csv";
    a.click();
}
</script>

</body>
</html>
